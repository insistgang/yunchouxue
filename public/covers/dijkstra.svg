<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Dijkstra算法封面：带权有向图与距离标号">
  <title>最短路径与 Dijkstra 算法</title>
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAFAF7"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#CBD5E1"/>
    </marker>
    <marker id="arr-settled" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#15803D"/>
    </marker>
    <marker id="arr-path" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1D4E89"/>
    </marker>
  </defs>
  <!-- Edges (gray, background) -->
  <g stroke="#CBD5E1" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <!-- A→C -->
    <line x1="164" y1="200" x2="354" y2="130"/>
    <!-- B→D -->
    <line x1="164" y1="430" x2="354" y2="490"/>
    <!-- C→D -->
    <line x1="394" y1="145" x2="394" y2="475"/>
    <!-- C→E -->
    <line x1="414" y1="130" x2="574" y2="200"/>
    <!-- D→E -->
    <line x1="414" y1="490" x2="574" y2="430"/>
    <!-- D→F -->
    <line x1="434" y1="490" x2="614" y2="430"/>
  </g>
  <!-- Shortest path edges (highlighted) -->
  <g stroke="#1D4E89" stroke-width="3" fill="none" marker-end="url(#arr-path)">
    <!-- A→B: source edge -->
    <line x1="164" y1="315" x2="164" y2="410"/>
    <!-- A→C -->
    <line x1="184" y1="295" x2="364" y2="145"/>
    <!-- C→E -->
    <line x1="414" y1="140" x2="574" y2="210"/>
    <!-- B→D -->
    <line x1="174" y1="445" x2="364" y2="487"/>
    <!-- D→F (optimal path) -->
    <line x1="424" y1="487" x2="614" y2="427"/>
  </g>
  <!-- Edge weight labels -->
  <g font-family="Georgia,serif" font-size="13" fill="#4A5568">
    <text x="230" y="118">2</text>
    <text x="140" y="370">5</text>
    <text x="265" y="475">3</text>
    <text x="385" y="320">1</text>
    <text x="505" y="155">4</text>
    <text x="505" y="475">2</text>
    <text x="530" y="445">2</text>
  </g>
  <!-- Nodes: A (source), B, C, D, E, F -->
  <!-- A: settled (source) -->
  <circle cx="160" cy="305" r="28" fill="#15803D" stroke="#FAFAF7" stroke-width="2"/>
  <text x="160" cy="305" text-anchor="middle" dominant-baseline="central" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="white">
    <tspan x="160" dy="0" alignment-baseline="central">A</tspan>
  </text>
  <text x="160" y="348" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#15803D">d=0</text>
  <!-- B: settled -->
  <circle cx="160" cy="430" r="28" fill="#15803D" stroke="#FAFAF7" stroke-width="2"/>
  <text x="160" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="white">
    <tspan x="160" y="434" alignment-baseline="central">B</tspan>
  </text>
  <text x="160" y="474" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#15803D">d=2</text>
  <!-- C: settled -->
  <circle cx="400" cy="130" r="28" fill="#15803D" stroke="#FAFAF7" stroke-width="2"/>
  <text x="400" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="white">
    <tspan x="400" y="134" alignment-baseline="central">C</tspan>
  </text>
  <text x="400" y="174" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#15803D">d=5</text>
  <!-- D: settled -->
  <circle cx="400" cy="490" r="28" fill="#15803D" stroke="#FAFAF7" stroke-width="2"/>
  <text x="400" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="white">
    <tspan x="400" y="494" alignment-baseline="central">D</tspan>
  </text>
  <text x="400" y="534" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#15803D">d=6</text>
  <!-- E: candidate -->
  <circle cx="600" cy="305" r="28" fill="white" stroke="#1D4E89" stroke-width="2.5"/>
  <text x="600" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#1D4E89">
    <tspan x="600" y="309" alignment-baseline="central">E</tspan>
  </text>
  <text x="600" y="350" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#1D4E89">d=9</text>
  <!-- F: optimal (destination) -->
  <circle cx="640" cy="430" r="28" fill="#1D4E89" stroke="#FAFAF7" stroke-width="2"/>
  <text x="640" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="white">
    <tspan x="640" y="434" alignment-baseline="central">F</tspan>
  </text>
  <text x="640" y="474" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#1D4E89">d=8</text>
  <!-- Title block -->
  <rect x="720" y="100" width="420" height="430" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="740" y="155" font-family="Georgia,serif" font-size="13" fill="#4A5568" letter-spacing="2">图论 · 最短路径</text>
  <text x="740" y="205" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#1A1A2E">最短路径与</text>
  <text x="740" y="245" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#1A1A2E">Dijkstra 算法</text>
  <line x1="740" y1="265" x2="1110" y2="265" stroke="#E2E8F0" stroke-width="1"/>
  <text x="740" y="300" font-family="sans-serif" font-size="15" fill="#4A5568">贪心 + 松弛迭代</text>
  <text x="740" y="325" font-family="sans-serif" font-size="15" fill="#4A5568">被看到 ≠ 被确定</text>
  <text x="740" y="350" font-family="sans-serif" font-size="15" fill="#4A5568">已确定集合逐步扩张</text>
  <line x1="740" y1="375" x2="1110" y2="375" stroke="#E2E8F0" stroke-width="1"/>
  <text x="740" y="410" font-family="Georgia,serif" font-size="13" fill="#1D4E89">难度 · 进阶</text>
  <text x="740" y="435" font-family="Georgia,serif" font-size="13" fill="#4A5568">运筹学教学站</text>
</svg>
